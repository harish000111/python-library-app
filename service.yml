apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: python

spec:
  clusterIP: None

  selector:
    name: db
    expose: clusterip

  ports:
    - port: 3306
      targetPort: 3306

---

apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: python

spec:
  type: ClusterIP

  selector:
    name: auth
    expose: clusterIP

  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: python
spec:
  type: ClusterIP
  selector:
    name: book
    expose: clusterIP
  ports:
    - port: 5002
      targetPort: 5002
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: borrow-service
  namespace: python
spec:
  type: ClusterIP
  selector:
    name: borrow
    expose: clusterIP
  ports:
    - port: 5003
      targetPort: 5003
      protocol: TCP


---
apiVersion: v1
kind: Service
metadata:
  name: forntend-service
  namespace: python
spec:
  type: LoadBalancer
  selector:
    name: app
    expose: LB
  ports:
    - port: 5000
      targetPort: 5000
      
